[project]
name = "remove-bg"
version = "0.1.0"
description = "Automatically remove image backgrounds using Python"
authors = [
  { name = "andersonlimacrv", email = "andersonlimacrv@gmail.com" }
]
readme = "README.md"
requires-python = "^3.12"

dependencies = [
  "rembg>=2.0.69,<3.0.0",
  "pillow>=12.0.0,<13.0.0",
  "onnxruntime (>=1.23.2,<2.0.0)",
  "vtracer>=0.6.15",
  "scikit-image>=0.24.0",
  "scipy>=1.12.0",
  "svgwrite>=1.4.3",
  "numpy>=1.26.0",
]

[project.scripts]
rmbg = "app.main:main"
cmpss = "app.main:main_compress"
anlz-cmpss = "app.main:main_analyze"
fmt-avt = "app.main:main_format_avatar"
img2svg = "app.main:main_vectorize"

[tool.poetry]
packages = [{ include = "app" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
